<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6B980"/>
      <stop offset="50%" stop-color="#B7791F"/>
      <stop offset="100%" stop-color="#8C5A12"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1000" height="1000" fill="#0B0F14"/>

  <!-- Outer aperture (cowry shell pinch using two mirrored arcs) -->
  <path d="
    M 250 120
    C 600 80, 850 350, 850 500
    C 850 650, 600 920, 250 880
    C 200 760, 200 240, 250 120
    Z"
    fill="none" stroke="#B7791F" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inner aperture -->
  <path d="
    M 350 260
    C 600 240, 720 380, 720 500
    C 720 620, 600 760, 350 740
    C 320 650, 320 350, 350 260
    Z"
    fill="none" stroke="#B7791F" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Vertical signal line -->
  <line x1="500" y1="260" x2="500" y2="740" stroke="#B7791F" stroke-width="28" stroke-linecap="round"/>

  <!-- Core node -->
  <circle cx="500" cy="500" r="18" fill="#B7791F"/>
</svg>
